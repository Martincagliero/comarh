<!-- REEMPLAZAR con el PNG real del logo COMARH (fondo transparente).
     Este SVG es un placeholder fiel a la descripción: dos triángulos verdes (claro/oscuro)
     + un triángulo azul marino a la derecha, y el texto "COMARH S.A.S." debajo.
     Muestreá los hex exactos del PNG real y actualizá las variables en style.css. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="COMARH S.A.S.">
  <!-- Pico / montaña en triángulos -->
  <polygon points="70,15 120,90 20,90" fill="#7AB55C"/>          <!-- verde claro -->
  <polygon points="70,15 95,55 45,55" fill="#2E6B3E"/>            <!-- verde oscuro (interno) -->
  <polygon points="150,35 195,90 105,90" fill="#1B2A4A"/>         <!-- azul marino -->
  <!-- Texto -->
  <text x="10" y="128" font-family="'Space Grotesk', Arial, sans-serif" font-size="30"
        font-weight="700" letter-spacing="1" fill="#1B2A4A">COMARH S.A.S.</text>
</svg>
